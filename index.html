<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DOOMSDAY</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;
    touch-action:none;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  body{display:flex;align-items:center;justify-content:center;background:#020208;}
  #wrap{position:relative;}
  canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#010614;
    box-shadow:0 0 40px rgba(30,60,160,.35);
    touch-action:none;
  }
  /* ---- mobile touch controls ---- */
  #touch{display:none;position:fixed;inset:0;z-index:10;pointer-events:none;font-family:monospace;}
  .tbtn{pointer-events:auto;position:absolute;width:16vmin;height:16vmin;border-radius:3vmin;
    border:2px solid rgba(140,180,255,.55);background:rgba(20,30,70,.45);color:#9cf;
    font:bold 4vmin monospace;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .tbtn.on{background:rgba(255,150,40,.4);border-color:#fc8;color:#ffe08a;}
  #tFire{right:4vw;bottom:20vh;width:24vmin;height:24vmin;border-radius:50%;
    border-color:rgba(255,120,80,.75);color:#fa8;border-width:3px;font-size:5vmin;}
  #tPow{right:5vw;bottom:10vh;font-size:3.6vmin;position:absolute;}
  #tPowN{position:absolute;top:-10px;right:-10px;background:#fc4;color:#000;
    border-radius:9px;font:bold 14px monospace;padding:2px 6px;display:none;}
  #tPause{right:3vw;top:2vh;width:13vmin;height:6.5vmin;font-size:3vmin;border-radius:3vmin;}
  #tHome{left:3vw;top:2vh;width:16vmin;height:6.5vmin;font-size:2.8vmin;border-radius:3vmin;display:none;}
  #tDiff{display:none;position:fixed;inset:0;z-index:10;pointer-events:none;font-family:monospace;}
  #tUp{left:6vw;bottom:26vh;}
  #tDown{left:6vw;bottom:8vh;}
  #tOk{right:6vw;bottom:8vh;width:22vmin;border-color:rgba(120,255,140,.6);color:#8f8;}
  @media (orientation: landscape) and (pointer: coarse){
    .tbtn{width:62px;height:62px;font-size:17px;}
    #tFire{right:14px;bottom:50px;width:88px;height:88px;}
    #tPow{right:20px;bottom:150px;font-size:13px;}
    #tPause{left:auto;right:14px;top:12px;bottom:auto;}
    #tHome{left:14px;top:12px;width:auto;padding:0 12px;height:40px;font-size:12px;}
    #tUp{left:14px;bottom:240px;}
    #tDown{left:14px;bottom:320px;}
    #tOk{right:14px;bottom:240px;width:110px;}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="640" height="360"></canvas></div>
<div id="touch">
  <button class="tbtn" id="tPow">PWR<span id="tPowN"></span></button>
  <button class="tbtn" id="tFire">FIRE</button>
  <button class="tbtn" id="tPause">| |</button>
  <button class="tbtn" id="tHome">HOME</button>
</div>
<div id="tDiff">
  <button class="tbtn" id="tUp">▲</button>
  <button class="tbtn" id="tDown">▼</button>
  <button class="tbtn" id="tOk">OK</button>
</div>
<script src="js/font.js"></script>
<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/particles.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
